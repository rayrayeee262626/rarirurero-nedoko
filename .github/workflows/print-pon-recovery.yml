name: Inspect Print PON recovery metadata (read only)
on:
  push:
    branches: [codex/print-pon-connection]
    paths: [.github/workflows/print-pon-recovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only Print PON project metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token:
              raise SystemExit('Existing repository Cloudflare secret is unavailable')
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/pages/projects/print-pon'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      data=json.load(response)
              except urllib.error.HTTPError as e:
                  raise SystemExit('Cloudflare request failed: HTTP '+str(e.code))
              if not data.get('success'):
                  raise SystemExit('Cloudflare request unsuccessful; response body withheld')
              return data['result']
          p=get(base)
          source=p.get('source') or {}
          config=source.get('config') or {}
          latest=p.get('canonical_deployment') or {}
          trigger=latest.get('deployment_trigger') or {}
          meta=trigger.get('metadata') or {}
          print(json.dumps({
              'project':p.get('name'),
              'production_branch':p.get('production_branch'),
              'source_type':source.get('type'),
              'source_owner':config.get('owner'),
              'source_repo':config.get('repo_name'),
              'build_config':{k:(p.get('build_config') or {}).get(k) for k in ['build_command','destination_dir','root_dir']},
              'deployment_id':latest.get('id'),
              'deployment_status':(latest.get('latest_stage') or {}).get('status'),
              'commit_hash':meta.get('commit_hash'),
              'branch':meta.get('branch'),
              'has_worker':latest.get('is_skipped'),
          },ensure_ascii=False))
          print('PROJECT_KEYS',json.dumps(sorted(p.keys())))
          print('DEPLOYMENT_KEYS',json.dumps(sorted(latest.keys())))
          for environment,values in (p.get('deployment_configs') or {}).items():
              print('CONFIG_SHAPE',environment,json.dumps({k:type(v).__name__ for k,v in values.items()}))
          for suffix in ['/deployments/'+latest['id'], '/deployments/'+latest['id']+'/files']:
              req=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=json.load(r)
                  result=data.get('result')
                  print('RECOVERY_ENDPOINT',suffix,'keys',sorted(result.keys()) if isinstance(result,dict) else type(result).__name__)
                  if isinstance(result,dict):
                      for key in ['manifest','files','assets']:
                          value=result.get(key)
                          if isinstance(value,dict):
                              print('ASSET_PATHS',json.dumps(list(value.keys())))
                          elif isinstance(value,list):
                              print('ASSET_COUNT',len(value))
              except urllib.error.HTTPError as e:
                  print('RECOVERY_ENDPOINT',suffix,'HTTP',e.code)

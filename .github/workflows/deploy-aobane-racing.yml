name: Publish standalone Aobane racing prototype

on:
  push:
    branches: [codex/deploy-aobane-racing]
    paths:
      - .github/workflows/deploy-aobane-racing.yml
      - tools/prepare-aobane-project.py
      - aobane-racing-dist/**

permissions:
  contents: read

concurrency: aobane-racing-release

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Cloudflare CLI
        run: npm exec --yes --package=wrangler@4.143.0 -- wrangler --version
      - name: Create and verify the standalone Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
        run: python3 tools/prepare-aobane-project.py
      - name: Deploy only the racing prototype assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
          WRANGLER_SEND_METRICS: 'false'
        run: npm exec --yes --package=wrangler@4.143.0 -- wrangler pages deploy aobane-racing-dist --project-name=aobane-virtual-racing --branch=preview

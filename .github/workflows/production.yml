name: Deploy approved production release

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact commit and build production files
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 -c "import os,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_COMMIT']"
          npm run check
          npm test
      - name: Install pinned tools without credentials
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==46.0.3
          npm exec --yes --package=wrangler@4.143.0 -- wrangler --version
      - name: Back up production BBS before release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
          D1_BACKUP_KEY: ${{ secrets.D1_BACKUP_KEY }}
          BACKUP_OUTPUT: ${{ runner.temp }}/pre-release-backup
        run: python3 tools/backup-d1.py
      - name: Preserve encrypted pre-release backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-pre-release-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-release-backup/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve settings, deploy exact files, verify, and roll back on failed verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
          BACKUP_OUTPUT: ${{ runner.temp }}/pre-release-backup
          WRANGLER_SEND_METRICS: 'false'
        run: python3 tools/deploy-production.py

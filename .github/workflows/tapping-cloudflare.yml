name: Publish Rarirurero Tapping to its own Cloudflare project
on:
  push:
    branches: [codex/tapping-cloudflare]
    paths:
      - managed-sites/rarirurero-tapping/**
      - tools/tapping-deploy.py
      - .github/workflows/tapping-cloudflare.yml
permissions:
  contents: read
concurrency:
  group: rarirurero-tapping-public
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate existing site and tapping game
        run: |
          npm run check
          npm test
          cd managed-sites/rarirurero-tapping
          node tests/game.test.js
          node tests/reactions.test.js
          node --check dist/game.js
      - name: Mobile continuous-touch browser checks before deployment
        run: |
          npm install --prefix "$RUNNER_TEMP/tapping-browser" --no-save --ignore-scripts playwright@1.62.1
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" NODE_PATH="$RUNNER_TEMP/tapping-browser/node_modules" node managed-sites/rarirurero-tapping/tests/mobile-browser.cjs
      - name: Install pinned deployment CLI without credentials
        run: npx --yes --package=wrangler@4.162.0 wrangler --version
      - name: Create separate project, publish tapping, and verify public files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
          WRANGLER_SEND_METRICS: 'false'
        run: python3 tools/tapping-deploy.py

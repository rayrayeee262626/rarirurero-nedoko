name: Check Cloudflare connection (no deployment)

on:
  push:
    branches: [codex/cloudflare-connect]
    paths:
      - .github/workflows/cloudflare-connect.yml
      - tools/cloudflare-connect.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Pages and D1 metadata with GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
        run: python3 tools/cloudflare-connect.py

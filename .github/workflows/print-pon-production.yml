name: Deploy Print PON with Wrangler
on:
  push:
    branches: [main]
    paths:
      - managed-sites/print-pon/**
      - tools/print-pon/**
      - .github/workflows/print-pon-production.yml
permissions:
  contents: read
concurrency:
  group: print-pon-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check existing repository
        run: |
          npm run check
          npm test
      - name: Build only Print PON assets
        run: |
          python3 tools/print-pon/build.py
          node tools/print-pon/test.mjs
          python3 tools/print-pon/check-pages.py
      - name: Browser regression checks without external traffic
        env:
          PRINT_PON_TEST_OUTPUT: ${{ runner.temp }}/print-pon-browser-results
        run: |
          npm install --prefix "$RUNNER_TEMP/print-pon-browser" --no-save --ignore-scripts playwright@1.62.1
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" NODE_PATH="$RUNNER_TEMP/print-pon-browser/node_modules" node tools/print-pon/browser-check.cjs
      - name: Install pinned Wrangler without credentials
        run: npx --yes --package=wrangler@4.162.0 wrangler --version
      - name: Deploy Print PON and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
          WRANGLER_SEND_METRICS: 'false'
        run: python3 tools/print-pon/deploy.py

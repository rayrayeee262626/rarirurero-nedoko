name: Print PON growth data
on:
  push:
    branches: [codex/print-pon-growth]
    paths:
      - tools/print-pon/growth-report.py
      - .github/workflows/print-pon-growth-report.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read aggregate access and action data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
        run: python3 tools/print-pon/growth-report.py

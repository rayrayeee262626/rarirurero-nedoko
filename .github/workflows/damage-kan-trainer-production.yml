name: Deploy Damage Kan Trainer
on:
  push:
    branches: [codex/damage-kan-trainer-release]
    paths:
      - managed-sites/damage-kan-trainer/**
      - .github/workflows/damage-kan-trainer-production.yml

permissions:
  contents: read

concurrency:
  group: damage-kan-trainer-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check existing repository
        run: |
          npm run check
          npm test
      - name: Test and build Damage Kan Trainer
        working-directory: managed-sites/damage-kan-trainer
        run: |
          npm ci
          npm test
          npm run build
      - name: Install pinned Wrangler
        run: npx --yes --package=wrangler@4.162.0 wrangler --version
      - name: Deploy to the dedicated Pages project
        working-directory: managed-sites/damage-kan-trainer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f76e5aa4c68f52aa641c4e00da7be273
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow"
            exit 1
          fi
          project=damage-kan-trainer
          npx --yes --package=wrangler@4.162.0 wrangler pages deploy dist --project-name "$project" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify the public HTML, JavaScript, CSS and license
        working-directory: managed-sites/damage-kan-trainer
        run: |
          set -euo pipefail
          url=https://damage-kan-trainer.pages.dev
          for file in index.html game.js style.css THIRD_PARTY_NOTICES.txt; do
            path="/$file"
            if [[ "$file" == index.html ]]; then path=/; fi
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 25 \
              "$url$path?release=$GITHUB_SHA" --output "$RUNNER_TEMP/damage-kan-$file"
            cmp "dist/$file" "$RUNNER_TEMP/damage-kan-$file"
          done
          echo "Verified production: $url/" >> "$GITHUB_STEP_SUMMARY"

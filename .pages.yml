media: media
content:
  - name: projects
    label: 作ったもの・制作中
    type: collection
    path: content/projects
    fields:
      - name: title
        label: 作品名
        type: string
        required: true
      - name: status
        label: 状態
        type: select
        options:
          values:
            - name: published
              label: 公開中
            - name: developing
              label: 制作中
            - name: paused
              label: 休止中
      - name: visible
        label: サイトに表示
        type: boolean
        default: false
      - name: url
        label: リンク
        type: string
      - name: description
        label: 説明
        type: text
  - name: writings
    label: 書いたもの（noteリンク）
    type: collection
    path: content/writings
    fields:
      - name: title
        label: 記事タイトル
        type: string
        required: true
      - name: url
        label: noteの記事URL
        type: string
        required: true
      - name: description
        label: 紹介文（本文はnoteで管理）
        type: text
      - name: visible
        label: サイトに表示
        type: boolean
        default: false

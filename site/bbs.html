<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="らりるれろの寝床 BBS。ひとこと残していってね。"><meta name="theme-color" content="#315d45"><title>掲示板（BBS） | らりるれろの寝床</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="main wrap"><header class="pagehead"><div class="eyebrow">GUESTBOOK / BBS</div><h1>掲示板（BBS）</h1><p>昔ながらの「カキコ」復活。雑談もキリ番報告も歓迎！ 匿名OK、返信もできます。</p></header><div class="bbs-layout"><section><h2 class="bbs-title">みんなのカキコ</h2><p class="bbs-status" id="bbs-status" role="status">投稿を読み込んでいます…</p><div class="bbs-threads" id="bbs-threads"></div><button id="bbs-more" class="button bbs-loadmore" style="display:none" type="button">もっと見る</button></section><aside class="bbs-panel"><h2 class="bbs-title" id="bbs-form-title">新しくカキコする</h2><p class="bbs-status">ひとこと、足跡残していってね。</p><form id="bbs-form" class="bbs-form"><label class="bbs-label">お名前（匿名可）<input type="text" id="bbs-name" maxlength="24" placeholder="通りすがりの名無し" autocomplete="nickname"></label><label class="bbs-label">本文<textarea id="bbs-message" required minlength="1" maxlength="1200" placeholder="はじめまして！" rows="5"></textarea><small>最大1200文字。URLなどは文字列として表示されます。</small></label><label class="bbs-honeypot">空欄にしてください<input id="bbs-company" type="text" autocomplete="off" tabindex="-1"></label><div id="bbs-turnstile"></div><input type="hidden" id="bbs-parent" value=""><div class="bbs-input-group"><button type="submit" class="button" id="bbs-submit">カキコする ✍️</button><button type="button" class="filter" id="bbs-cancel-reply" style="display:none">返信をやめる</button></div><p class="bbs-meta" id="bbs-form-status" role="status"></p></form><div class="bbs-privacy">投稿は一般公開されます。個人情報は書かないでね。迷惑投稿対策のため、アクセス情報の一部を一方向変換して短期間の連投防止に利用します。</div><details class="bbs-admin"><summary>管理人用</summary><label>管理人キー<input id="bbs-admin-key" type="password" autocomplete="off" placeholder="Cloudflareに設定したキー"></label><p>入力中のみ各投稿に削除ボタンが表示されます。管理人キーはブラウザに保存しません。</p></details></aside></div></main><div id="site-footer"></div><script src="app.js" defer></script><script src="bbs.js" defer></script></body></html>
